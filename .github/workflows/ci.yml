name: CI

on:
  push:
    branches: []
  pull_request: [master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Dummy value: only test:e2e boots the app (via ConfigModule's
      # validation), and nothing here talks to a real token consumer.
      JWT_SECRET: ci-only-dummy-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm test:e2e

      - run: pnpm build
